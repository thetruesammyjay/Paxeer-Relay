[project]
name = "paxrelay-api"
version = "0.1.0"
description = "PaxRelay control-plane FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.29.0",
    "alembic~=1.13",
    "redis~=5.1",
    "httpx~=0.27.0",
    "jsonschema>=4.23.0",
    "python-jose[cryptography]~=3.3.0",
    "python-multipart~=0.0.12",
    "paxrelay-db",
    "paxrelay-domain",
    "paxrelay-policy",
    "paxrelay-router",
    "paxrelay-paxeer",
    "paxrelay-receipts",
]

[tool.uv.sources]
paxrelay-db = { workspace = true }
paxrelay-domain = { workspace = true }
paxrelay-policy = { workspace = true }
paxrelay-router = { workspace = true }
paxrelay-paxeer = { workspace = true }
paxrelay-receipts = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_api", "app"]
