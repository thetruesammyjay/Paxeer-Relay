[project]
name = "paxrelay-gateway"
version = "0.1.0"
description = "PaxRelay 402LXP payment gateway and request proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.9,<2",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "paxrelay-db",
    "paxrelay-domain",
    "paxrelay-policy",
    "paxrelay-router",
    "paxrelay-receipts",
    "paxrelay-paxeer",
]

[tool.uv.sources]
paxrelay-db = { workspace = true }
paxrelay-domain = { workspace = true }
paxrelay-policy = { workspace = true }
paxrelay-router = { workspace = true }
paxrelay-receipts = { workspace = true }
paxrelay-paxeer = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_gateway"]
