[project]
name = "paxrelay-worker"
version = "0.1.0"
description = "PaxRelay background worker service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.0",
    "paxrelay-db",
    "paxrelay-domain",
    "paxrelay-receipts",
    "paxrelay-paxeer",
]

[tool.uv.sources]
paxrelay-db = { workspace = true }
paxrelay-domain = { workspace = true }
paxrelay-receipts = { workspace = true }
paxrelay-paxeer = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_worker"]
