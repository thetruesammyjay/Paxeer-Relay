[project]
name = "paxrelay-domain"
version = "0.1.0"
description = "PaxRelay framework-independent domain model and business rules"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_domain"]
