[project]
name = "paxrelay-mcp"
version = "0.1.0"
description = "PaxRelay Python MCP provider and agent adapters"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "paxrelay-domain",
]

[tool.uv.sources]
paxrelay-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_mcp"]
