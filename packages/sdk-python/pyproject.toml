[project]
name = "paxrelay"
version = "0.1.0"
description = "Async PaxRelay Python SDK for agents, providers, services, policies, approvals, analytics, transactions, and receipts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "paxrelay-receipts",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.uv.sources]
paxrelay-receipts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay"]
