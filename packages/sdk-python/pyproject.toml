[project]
name = "paxrelay"
version = "0.1.0"
description = "PaxRelay Python SDK for agent and provider integration"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay"]
