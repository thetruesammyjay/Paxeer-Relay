[project]
name = "paxrelay-db"
version = "0.1.0"
description = "PaxRelay database models, repositories and migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "paxrelay-domain",
]

[tool.uv.sources]
paxrelay-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_db"]
