# Alembic configuration for the paxrelay-db package.
# Can be invoked from this folder with: uv run python -m alembic upgrade head
[alembic]
script_location = %(here)s/src/paxrelay_db/migrations
prepend_sys_path = %(here)s/src
# env.py reads DATABASE_URL from the shell or a local/root .env file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
