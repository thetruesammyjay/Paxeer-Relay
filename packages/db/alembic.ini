# Alembic configuration for the paxrelay-db package.
# Invoked via: uv run --package paxrelay-db alembic upgrade head
[alembic]
script_location = src/paxrelay_db/migrations
prepend_sys_path = src
# The database URL is read from the DATABASE_URL environment variable in env.py,
# so this placeholder is intentionally left blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
