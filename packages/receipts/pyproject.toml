[project]
name = "paxrelay-receipts"
version = "0.1.0"
description = "PaxRelay execution receipt canonicalisation, hashing, signing and verification"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "paxrelay-domain",
]

[tool.uv.sources]
paxrelay-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxrelay_receipts"]
